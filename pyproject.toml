[project]
name = "triathlon-trainer"
version = "0.1.0"
description = "AI Triathlon Trainer with Garmin Connect MCP Integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "garminconnect>=0.3.2",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "python-telegram-bot[job-queue]>=20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

